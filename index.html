<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小狗打卡器</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="box-icon"></div>
    <h1>小狗打卡器</h1>
    <p class="desc">每天吐舌头拍一张，选最好看的打卡。日历记着，海报给爸爸和小狗各一版。</p>

    <label>爸爸的昵称</label>
    <input id="dad" value="Kuro">

    <label>小狗的昵称</label>
    <input id="puppy" value="Puppy">

    <p class="tip-text">默认<span id="tipShow">Kuro × Puppy</span> · 文案如「我是Kuro爸爸的小狗Puppy」</p>

    <button class="btn-start" onclick="saveInfo()">开始当小狗</button>

    <div class="tools-section">
        <h3>数据管理</h3>
        <button class="btn-ghost" onclick="exportAllToTG()">📤 打包全部打卡内容到TG频道</button>
        <p class="tool-note">把你这个设备上的所有照片/视频，按日期分文件夹打成 zip（按 ~48MB 切分），通过机器人发到 Telegram 频道。<br>每条记录都会在 zip 里存一份原件。</p>
    </div>

    <div class="export-modal" id="exportModal" style="display:none;">
        <div class="export-inner">
            <h3 id="exportTitle">打包全部到 TG</h3>
            <div class="export-stats" id="exportStats"></div>
            <div class="batch-progress"><div id="exportBar"></div></div>
            <p class="batch-sub" id="exportSub"></p>
            <button class="btn-ghost" style="width:100%;margin-top:16px;" onclick="closeExport()">关闭</button>
        </div>
    </div>

    <p class="bottom-note">可安装到手机主屏幕·照片上传至图床，失败时存本地</p>

    <!-- 底部导航 -->
    <div class="tab-bar">
        <div class="tab-item" onclick="location.href='home.html'">今日拍照</div>
        <div class="tab-item" onclick="location.href='calendar.html'">打卡日历</div>
        <div class="tab-item" onclick="location.href='chat.html'">小狗聊天</div>
        <div class="tab-item tab-active">我的</div>
    </div>

<script src="db.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="index.js"></script>
</body>
</html>
