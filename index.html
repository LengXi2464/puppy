<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小狗打卡器</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="box-icon"></div>
    <h1>小狗打卡器</h1>
    <p class="desc">每天吐舌头拍一张，选最好看的打卡。日历记着，海报给爸爸和小狗各一版。</p>

    <label>爸爸的昵称</label>
    <input id="dad" value="Kuro">

    <label>小狗的昵称</label>
    <input id="puppy" value="Puppy">

    <p class="tip-text">默认<span id="tipShow">Kuro × Puppy</span> · 文案如「我是Kuro爸爸的小狗Puppy」</p>

    <button class="btn-start" onclick="saveInfo()">开始当小狗</button>
    <p class="bottom-note">可安装到手机主屏幕·照片上传至图床，失败时存本地</p>

<script src="index.js"></script>
</body>
</html>
